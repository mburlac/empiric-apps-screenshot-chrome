<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F7;
      --border: #E5E5E7;
      --text: #1D1D1F;
      --text-muted: #86868B;
      --accent: #1D4ED8;
      --accent-hover: #1E3A8A;
      --accent-disabled: #C7C7CC;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3B82F6 0%, #1E3A8A 100%);
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: -0.02em;
      font-family: inherit;
    }
    .logo::before,
    .logo::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 5px;
      height: 5px;
      border: 1.2px solid rgba(255, 255, 255, 0.9);
    }
    .logo::before {
      left: 4px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 1px;
    }
    .logo::after {
      right: 4px;
      border-left: none;
      border-bottom: none;
      border-top-right-radius: 1px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin: 1px 0 0 0;
      letter-spacing: 0.01em;
      text-decoration: none;
    }
    .subtitle:hover { color: var(--accent); text-decoration: underline; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.005em;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #ECECEE;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke-width: 2;
    }

    .btn-label {
      flex: 1;
      text-align: left;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 2px 6px;
      border-radius: 5px;
      opacity: 0.7;
    }
    .btn-primary .kbd {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
    }
    .btn-secondary .kbd {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .kbd:empty { display: none; }

    .option {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .option-label {
      font-size: 12px;
      color: var(--text);
      user-select: none;
    }
    .option-hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
      letter-spacing: 0.01em;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #D1D1D6;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #FFFFFF;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .switch input:checked + .slider {
      background: #34C759;
    }
    .switch input:checked + .slider::before {
      transform: translateX(14px);
    }

    .segmented {
      display: inline-flex;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .seg {
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .seg:hover:not(.active) { background: #F5F5F7; }
    .seg.active {
      background: var(--accent);
      color: #FFFFFF;
    }

    .status {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      min-height: 14px;
      letter-spacing: 0.01em;
      line-height: 1.5;
    }
    .status.success { color: #34C759; }
    .status.error {
      color: #FF3B30;
      background: rgba(255, 59, 48, 0.08);
      padding: 8px 10px;
      border-radius: 8px;
      text-align: left;
    }

    .progress {
      height: 3px;
      background: var(--surface);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .progress.active { opacity: 1; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo" aria-hidden="true">E</div>
      <div>
        <p class="title">Empiric Studio</p>
        <a class="subtitle" href="https://www.empiricapps.com/?utm_source=empiric-studio-chrome" target="_blank" rel="noopener">www.empiricapps.com</a>
      </div>
    </div>

    <div class="actions">
      <button id="captureFull" class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M3 9h18"/>
          <path d="M3 15h18"/>
        </svg>
        <span class="btn-label">Capture full page</span>
        <span class="kbd" id="kbdFull"></span>
      </button>

      <button id="captureRegion" class="btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
          <path d="M20 16v2a2 2 0 0 1-2 2h-2"/>
          <path d="M8 20H6a2 2 0 0 1-2-2v-2"/>
        </svg>
        <span class="btn-label">Select area</span>
        <span class="kbd" id="kbdRegion"></span>
      </button>

      <button id="captureElement" class="btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M9 8h6"/>
          <path d="M9 12h6"/>
          <path d="M9 16h4"/>
        </svg>
        <span class="btn-label">Capture element</span>
      </button>
    </div>

    <label class="option" for="copyToggle">
      <div>
        <div class="option-label">Copy to clipboard</div>
        <div class="option-hint">Also save to Downloads</div>
      </div>
      <div class="switch">
        <input type="checkbox" id="copyToggle">
        <span class="slider"></span>
      </div>
    </label>

    <label class="option" for="editToggle">
      <div>
        <div class="option-label">Edit before save</div>
        <div class="option-hint">Only for Select area</div>
      </div>
      <div class="switch">
        <input type="checkbox" id="editToggle">
        <span class="slider"></span>
      </div>
    </label>

    <div class="option delay-row">
      <div>
        <div class="option-label">Capture delay</div>
        <div class="option-hint">Waits before capture</div>
      </div>
      <div class="segmented" id="delaySegments">
        <button data-delay="0" class="seg active">Now</button>
        <button data-delay="3" class="seg">3s</button>
        <button data-delay="5" class="seg">5s</button>
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
